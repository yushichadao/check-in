<!doctype html>
<html lang="zh-CN" data-theme="campus">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>活动范围</title>
  <!-- 站点图标：现代浏览器用 SVG，其余回退 PNG -->
  <link rel="icon" href="favicon.ico?v=2">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/no-autofill.js"></script>
<script src="js/brand.js" defer></script>
</head>
<body>
  <!-- 统一图标（线性 SVG sprite）：本页仅用到昼夜切换图标 -->
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true" focusable="false">
    <symbol id="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
    <symbol id="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <!-- 活动范围编辑工具 -->
    <symbol id="ico-poly" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 20.6 8 17.7 19 6.3 19 3.4 8 12 3.2Z"/><circle cx="12" cy="3.2" r="1.25" fill="currentColor" stroke="none"/><circle cx="20.6" cy="8" r="1.25" fill="currentColor" stroke="none"/><circle cx="17.7" cy="19" r="1.25" fill="currentColor" stroke="none"/><circle cx="6.3" cy="19" r="1.25" fill="currentColor" stroke="none"/><circle cx="3.4" cy="8" r="1.25" fill="currentColor" stroke="none"/></symbol>
    <symbol id="ico-rect" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6.5" width="16" height="11" rx="1.5"/></symbol>
    <symbol id="ico-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></symbol>
    <symbol id="ico-erase" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
    <symbol id="ico-select" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></symbol>
  </svg>
  <div class="shell one-col">
    <div class="main">
      <header class="topbar">
        <div class="row" style="gap:10px;align-items:center;flex-wrap:wrap">
          <b id="pageTitle">活动范围</b>
          <span class="muted" id="pageHint"></span>
        </div>
        <div class="row">
          <button class="btn sm" id="themeToggleBtn" type="button" title="切换到夜间模式" aria-label="切换到夜间模式" aria-pressed="false"><svg class="ico" width="16" height="16" aria-hidden="true" focusable="false"><use href="#ico-moon"></use></svg><span id="themeToggleText">夜间</span></button>
        </div>
      </header>

      <div class="content">
        <section class="section active" id="sec-fence">
          <div class="card">
            <header>
              <h2 id="cardTitle">活动范围</h2>
              <div class="row">
                <button class="btn sm" id="backBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> 返回</button>
                <button class="btn sm" id="reloadBtn">刷新</button>
              </div>
            </header>

            <!-- 编辑区：新建时显示（原「新建活动范围」卡已与下方地图合并为同一张卡片） -->
            <div id="editCard" class="fence-edit hidden">
              <div class="row fence-toolbar">
                <button class="btn sm" id="fPoly" type="button" title="画多边形" aria-label="画多边形"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#ico-poly"></use></svg><span>画多边形</span></button>
                <button class="btn sm" id="fRect" type="button" title="矩形模板" aria-label="矩形模板"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#ico-rect"></use></svg><span>矩形模板</span></button>
                <button class="btn sm" id="fCircle" type="button" title="圆形模板" aria-label="圆形模板"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#ico-circle"></use></svg><span>圆形模板</span></button>
                <button class="btn sm" id="fClear" type="button" title="清除图形" aria-label="清除图形"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#ico-erase"></use></svg><span>清除图形</span></button>
                <button class="btn sm" id="fSelect" type="button" title="选择" aria-label="选择"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#ico-select"></use></svg><span>选择</span></button>
                <div id="fLayerBtn" class="layer-toggle" role="group" aria-label="底图切换（电子地图 / 卫星地图）"></div>
                <span class="tag draft-count empty" id="fDraftCount"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 21 8v8l-9 5-9-5V8l9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg> 图形 0 个</span>
              </div>
              <div class="row fence-save">
                <input id="fBatch" required aria-required="true" placeholder="活动范围名称（必填）" style="flex:1;min-width:200px">
                <button class="btn primary" id="fSave" data-perm="FENCE_DRAW">保存活动范围</button>
              </div>
              <div class="muted fence-hint">
                一个活动范围可包含多个多边形「范围」：连续点击落点，点回起点（或双击、右键）闭合；矩形点两角；圆形先点圆心、再点边缘定半径。
                每闭合一个即成为一个「图形」，可继续画下一个，最后一起保存为一个活动范围。
                <b>选择</b>模式下：<b>点击</b>范围可编辑顶点（拖动小方块移动、右键删除）；任意模式<b>右键</b>范围移除草稿。
                活动范围按绘制边界严格判定，请自行往外预留缓冲。
              </div>
            </div>

            <div id="fenceMap" class="fence-map"></div>
            <div class="muted fence-meta" id="fenceMeta">加载中…</div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layer-toggle.js"></script>
  <script src="js/fence-editor.js"></script>
  <script src="js/fence.js"></script>
</body>
</html>
