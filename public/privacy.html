<!doctype html>
<html lang="zh-CN" data-theme="campus">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>隐私政策</title>
  <!-- 站点图标：现代浏览器用 SVG，其余回退 PNG -->
  <link rel="icon" href="favicon.ico?v=2">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme.js"></script>
<script src="js/brand.js" defer></script>
</head>
<body>
  <div class="content">
    <div class="card form-card">
      <header>
        <h2>隐私政策</h2>
        <span class="tag" id="updatedTag" style="display:none"></span>
      </header>

      <div class="alert info" style="font-size:12px">
        请在阅读完本政策后返回注册页完成注册。
      </div>

      <div id="policyBox" style="white-space:pre-wrap;line-height:1.8;font-size:14px;max-height:60vh;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--surface-2)">
        加载中…
      </div>
      <div class="muted" id="scrollHint" style="font-size:12px;margin-top:8px">
        ↓ 请向下滚动阅读至底部后，「我已阅读完」才可点击；返回注册页后「我已阅读并同意」勾选框才会解锁。
      </div>

      <div class="row end" style="margin-top:14px;gap:8px">
        <button class="btn primary" id="doneBtn" type="button" disabled>我已阅读完</button>
        <a class="btn" href="register.html">返回注册</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/privacy.js"></script>
</body>
</html>
