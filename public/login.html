<!doctype html>
<html lang="zh-CN" data-theme="campus">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>班级签到系统 · 登录</title>
  <!-- 站点图标：现代浏览器用 SVG，其余回退 PNG -->
  <link rel="icon" href="favicon.ico?v=2">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme.js"></script>
<script src="js/brand.js" defer></script>
</head>
<body>
  <!-- 仅登录页顶部维护提醒：维护中展示，提醒用户部分功能暂不可用（登录页本身不盖遮罩，故用此横幅） -->
  <div id="maintTopBanner" class="maint-top-banner hidden" role="alert"></div>
  <div class="content">
    <div class="card form-card">
      <header>
        <div>
          <h2 data-brand>班级签到系统</h2>
          <div data-subtitle class="hidden" style="color:var(--muted);font-size:13px;line-height:1.4;margin-top:5px;padding-left:12px"></div>
        </div>
      </header>

      <div id="msg"></div>

      <div id="accountChips" class="hidden" style="margin-bottom:12px"></div>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="real_name">姓名</label>
          <input id="real_name" placeholder="请输入登记的姓名" autocomplete="off">
        </div>
        <div class="field">
          <label for="identity">身份</label>
          <select id="identity" autocomplete="off">
            <option value="" disabled selected hidden>请选择身份</option>
            <option value="普通学生">普通学生</option>
            <option value="班委">班委</option>
            <option value="小班主任">小班主任</option>
            <option value="辅导员">辅导员</option>
            <option value="运维者">运维者</option>
          </select>
        </div>
        <div class="field">
          <label for="student_id">学号</label>
          <input id="student_id" placeholder="请输入学号" autocomplete="off">
          <span class="hint">运维者 / 管理员账号忽略学号（自动置灰不可填）</span>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" type="password" placeholder="请输入密码" autocomplete="new-password" name="__off_pwd">
        </div>
        <div class="row check-row" style="gap:16px; flex-wrap:wrap">
          <label style="cursor:pointer; display:flex; align-items:center; gap:6px; font-weight:400; color:var(--text)">
            <input type="checkbox" id="remember" style="width:auto"> 记住密码
          </label>
          <label style="cursor:pointer; display:flex; align-items:center; gap:6px; font-weight:400; color:var(--text)">
            <input type="checkbox" id="autoLogin" style="width:auto"> 自动登录
          </label>
          <span class="muted" style="font-size:12px">仅保存在本机浏览器，登出后仍保留；自动登录会在打开登录页时直接登录</span>
        </div>
        <button class="btn primary block big" type="submit" id="submitBtn">登 录</button>
      </form>

      <div class="row between foot-row">
        <a href="register.html">还没有账号？去注册</a>
        <a href="forgot.html">忘记密码</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
