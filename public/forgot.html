<!doctype html>
<html lang="zh-CN" data-theme="campus">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>找回密码</title>
  <!-- 站点图标：现代浏览器用 SVG，其余回退 PNG -->
  <link rel="icon" href="favicon.ico?v=2">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme.js"></script>
<script src="js/brand.js" defer></script>
</head>
<body>
  <div class="content">
    <div class="card" style="max-width:560px;margin:4vh auto">
      <header>
        <h2>找回密码</h2>
      </header>

      <div id="msg"></div>

      <div class="alert info">
        找回密码（用户端 / 管理端 / 运维端通用）：① 用<b>注册邮箱</b>接收验证码自助重置；② 若无法使用邮箱，用户端可请管理员 / 运维者<b>清除密码</b>后重设，管理端请运维者清除，运维端在部署服务器终端执行：<pre style="margin:8px 0 0;white-space:pre-wrap">npm run reset-ops</pre>
      </div>

      <!-- 方式切换按钮 -->
      <div class="row" style="gap:8px;margin:0 0 14px">
        <button class="btn primary" id="tabMethod1" type="button" style="flex:1">方式一：请求清除密码</button>
        <button class="btn" id="tabMethod2" type="button" style="flex:1">方式二：邮箱自助重置</button>
      </div>

      <!-- 方式一 -->
      <div id="panelMethod1">
        <div class="field">
          <label for="f_name">姓名</label>
          <input id="f_name" placeholder="请输入登记的姓名" autocomplete="off">
        </div>
        <div class="field">
          <label for="f_identity">身份</label>
          <select id="f_identity" autocomplete="off">
            <option value="" disabled selected hidden>请选择身份</option>
            <option value="普通学生">普通学生</option>
            <option value="班委">班委</option>
            <option value="小班主任">小班主任</option>
            <option value="辅导员">辅导员</option>
            <option value="运维者">运维者</option>
          </select>
        </div>
        <div class="field">
          <label for="f_sid">学号</label>
          <input id="f_sid" placeholder="请输入学号（管理员可留空）" autocomplete="off">
        </div>
        <button class="btn block" id="forgotSubmit" type="button">提交找回申请</button>
      </div>

      <!-- 方式二 -->
      <div id="panelMethod2" class="hidden">
        <div class="muted" style="font-size:12px;margin-bottom:10px">未登记邮箱或收不到验证码？请改用上方「方式一：请求清除密码」。</div>
        <div class="field">
          <label for="e_name">姓名</label>
          <input id="e_name" placeholder="请输入登记的姓名" autocomplete="off">
        </div>
        <div class="field">
          <label for="e_identity">身份</label>
          <select id="e_identity" autocomplete="off">
            <option value="" disabled selected hidden>请选择身份</option>
            <option value="普通学生">普通学生</option>
            <option value="班委">班委</option>
            <option value="小班主任">小班主任</option>
            <option value="辅导员">辅导员</option>
            <option value="运维者">运维者</option>
          </select>
        </div>
        <div class="field">
          <label for="e_sid">学号</label>
          <input id="e_sid" placeholder="请输入学号（管理员可留空）" autocomplete="off">
        </div>
        <div class="field">
          <label for="e_email">注册邮箱</label>
          <div class="row" style="gap:8px">
            <input id="e_email" style="flex:1;min-width:0" placeholder="注册时填写的邮箱" autocomplete="off">
            <button class="btn" id="eSendCode" type="button">发送验证码</button>
          </div>
        </div>
        <div class="field">
          <label for="e_code">邮箱验证码</label>
          <input id="e_code" placeholder="6 位数字" maxlength="6" inputmode="numeric" autocomplete="off">
        </div>
        <div class="field">
          <label for="e_pwd">新密码</label>
          <input id="e_pwd" type="password" placeholder="至少 6 位" autocomplete="new-password" name="__off_ep">
        </div>
        <div class="field">
          <label for="e_pwd2">确认新密码</label>
          <input id="e_pwd2" type="password" placeholder="再次输入新密码" autocomplete="new-password">
        </div>
        <button class="btn primary block" id="eResetBtn" type="button">重置密码</button>
      </div>

      <div class="row between" style="margin-top:16px">
        <a href="login.html">返回登录</a>
        <a href="register.html">还没有账号？去注册</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/forgot.js"></script>
</body>
</html>
